<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ระบบบันทึกการเยี่ยมผู้สูงอายุที่มีภาวะพึ่งพิง | รพ.สต.บ้านทับสอ ต.งิ้วด่อน อ.เมือง จ.สกลนคร</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pine:#17362e; --pine2:#1f4a3f; --p:#1d6b57; --p2:#155243; --pl:#dcefe8;
  --gold:#e0a526; --gold-l:#fbf0d3;
  --bg:#eef1ee; --card:#fff; --tx:#22302b; --mu:#66756f; --bd:#dde4e0;
  --g1:#2e9d5b; --g2:#e0a526; --g3:#cc4b3c; --g0:#9aa6a1;
  --r:12px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Sarabun',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);font-size:16px;line-height:1.55}
body.noscroll{overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.3}
a{color:var(--p)}
:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.hide{display:none!important}

/* ---------- login ---------- */
#login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.lg-art{background:var(--pine);color:#fff;padding:56px 56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.lg-art:after{content:"";position:absolute;right:-120px;bottom:-120px;width:420px;height:420px;border-radius:50%;border:56px solid rgba(224,165,38,.16)}
.lg-art h1{font-size:40px;font-weight:700;line-height:1.25;max-width:520px}
.lg-art p{color:#b8cfc7;max-width:460px;margin:16px 0 0;font-size:18px}
.lg-org{font-size:15px;letter-spacing:.2px;color:#e8c56a;font-weight:600}
.lg-seg{display:flex;height:12px;border-radius:6px;overflow:hidden;max-width:360px;margin-bottom:10px}
.lg-seg i{display:block}
.lg-form{display:flex;align-items:center;justify-content:center;padding:32px;background:var(--card)}
.lg-box{width:100%;max-width:360px}
.lg-box h2{font-size:26px;margin-bottom:6px}
.lg-box .sub{color:var(--mu);margin:0 0 24px}
.lg-err{color:var(--g3);min-height:24px;margin:8px 0;font-size:15px}
.lg-hint{background:var(--gold-l);border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:16px}
@media(max-width:820px){#login{grid-template-columns:1fr}.lg-art{padding:28px 24px;min-height:auto;gap:24px}.lg-art h1{font-size:26px}.lg-art p{font-size:16px}.lg-art:after{display:none}}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
#side{width:250px;background:var(--pine);color:#dbe8e3;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:40;transition:transform .2s}
.brand{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,.09)}
.brand b{display:block;color:#fff;font-size:17px;line-height:1.35}
.brand small{color:#e8c56a;font-size:13px}
#nav{padding:12px 10px;flex:1;overflow-y:auto}
#nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;color:inherit;padding:11px 12px;border-radius:9px;cursor:pointer;margin-bottom:2px}
#nav button .ic{width:24px;text-align:center;font-size:18px}
#nav button:hover{background:rgba(255,255,255,.07)}
#nav button.on{background:var(--gold);color:#2b2100;font-weight:600}
.me{padding:14px 16px;border-top:1px solid rgba(255,255,255,.09);font-size:14px}
.me b{display:block;color:#fff;font-size:15px}
.me .rl{color:#9fb8ae;margin-bottom:8px}
.me button{background:rgba(255,255,255,.09);border:0;color:#fff;border-radius:7px;padding:5px 10px;cursor:pointer;margin-right:6px;font-size:13px}
.main{margin-left:250px;flex:1;min-width:0}
.top{position:sticky;top:0;z-index:30;background:rgba(238,241,238,.94);backdrop-filter:blur(6px);display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--bd)}
.top h1{font-size:22px;flex:1}
#burger{display:none;background:var(--pine);color:#fff;border:0;border-radius:8px;width:40px;height:40px;font-size:20px;cursor:pointer}
.sync{font-size:13px;color:var(--mu);display:flex;align-items:center;gap:6px}
.sync:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--g0)}
.sync.on:before{background:var(--g1)}
.sync.off:before{background:var(--g3)}
#content{padding:24px 28px 60px;max-width:1400px}
.scrim{display:none}
@media(max-width:960px){
  #side{transform:translateX(-100%)}
  #side.open{transform:none}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
  .main{margin-left:0}
  #burger{display:block}
  .top{padding:10px 14px}.top h1{font-size:18px}
  #content{padding:16px 14px 60px}
}

/* ---------- common ---------- */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:18px 20px}
.card h3{font-size:17px;margin-bottom:12px}
.card h3 small{font-weight:400;color:var(--mu);font-size:14px;margin-left:6px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:space-between}
.grow{flex:1}
.mt{margin-top:18px}.mt2{margin-top:10px}
.mu{color:var(--mu)}
.sm{font-size:14px}
.btn{border:1px solid transparent;border-radius:9px;padding:9px 16px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;background:var(--p);color:#fff;white-space:nowrap}
.btn:hover{background:var(--p2)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-o{background:#fff;color:var(--tx);border-color:var(--bd)}
.btn-o:hover{background:#f3f6f4}
.btn-d{background:var(--g3)}.btn-d:hover{background:#a93a2d}
.btn-g{background:var(--gold);color:#2b2100}.btn-g:hover{background:#c99118}
.btn-s{padding:5px 10px;font-size:14px;border-radius:7px}
.badge{display:inline-block;border-radius:20px;padding:1px 10px;font-size:13px;font-weight:500;white-space:nowrap}
.b-g1{background:#dff3e6;color:#1d7040}.b-g2{background:#fbeccb;color:#8a5f05}.b-g3{background:#f8dcd8;color:#a3362a}.b-n{background:#e6ebe8;color:#55645e}
.b-p{background:var(--pl);color:var(--p2)}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:var(--r);background:#fff}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--bd);vertical-align:top}
th{background:#f4f7f5;font-weight:600;font-size:14px;color:#3d4d47;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafcfb}
td.n,th.n{text-align:right}
.empty{padding:36px 16px;text-align:center;color:var(--mu)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.toolbar input,.toolbar select{min-width:150px}
input,select,textarea{border:1px solid #c9d3ce;border-radius:8px;padding:8px 11px;background:#fff;width:100%}
input[type=checkbox],input[type=radio]{width:auto}
textarea{min-height:76px;resize:vertical}
.toolbar input,.toolbar select{width:auto}
label.f{display:block}
label.f>span{display:block;font-size:14px;color:#3d4d47;margin-bottom:3px;font-weight:500}
label.f>span i{color:var(--g3);font-style:normal}
.grid{display:grid;gap:12px 14px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
.span2{grid-column:span 2}.spanall{grid-column:1/-1}
@media(max-width:720px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}.g6{grid-template-columns:repeat(3,1fr)}.span2{grid-column:span 2}}
@media(max-width:480px){.g3,.g4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}.span2{grid-column:1/-1}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{cursor:pointer}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;padding:5px 13px;border:1px solid #c9d3ce;border-radius:20px;font-size:15px;background:#fff}
.chip input:checked+span{background:var(--p);border-color:var(--p);color:#fff}
.chip input:focus-visible+span{outline:3px solid var(--gold)}
.sec{border-top:1px solid var(--bd);margin-top:20px;padding-top:16px}
.sec>h4{margin-bottom:10px;font-size:16px;color:var(--p2)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--bd);margin-bottom:16px;flex-wrap:wrap}
.tabs button{background:none;border:0;padding:9px 18px;cursor:pointer;font-weight:500;color:var(--mu);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--p2);border-color:var(--gold)}
.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--pl);display:inline-flex;align-items:center;justify-content:center;color:var(--p2);font-weight:600;flex:none}

/* ---------- dashboard ---------- */
.pub{min-height:100vh;display:flex;flex-direction:column}
.pub-h{background:var(--pine);color:#fff;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:30}
.pub-h b{display:block;font-size:18px}.pub-h small{color:#e8c56a}
.pub-h .btn-o{color:var(--tx)}
.pub-b{flex:1;width:100%;max-width:1300px;margin:0 auto;padding:0 24px 40px}
.pub-f{text-align:center;color:var(--mu);font-size:14px;padding:16px;border-top:1px solid var(--bd)}
@media(max-width:720px){.pub-h{padding:10px 14px}.pub-h b{font-size:15px}.pub-b{padding:0 14px 30px}}
.dp{display:block;position:relative}
.dp-v{cursor:pointer;padding-right:34px;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='%2366756f' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='4' width='18' height='18' rx='2'/><path d='M16 2v4M8 2v4M3 10h18'/></svg>") no-repeat right 10px center}
.dp-v:disabled{background-color:#f1f3f2;cursor:not-allowed}
.toolbar .dp{display:inline-block}.toolbar .dp-v{width:auto;min-width:170px}
.dp-pop{position:fixed;z-index:400;width:296px;max-width:calc(100vw - 16px);background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.28);padding:12px}
.dp-h{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.dp-h select{padding:6px;flex:1;min-width:0}
.dp-h button{width:34px;height:34px;border:1px solid var(--bd);background:#fff;border-radius:8px;cursor:pointer;font-size:20px;line-height:1;flex:none}
.dp-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.dp-g .w{font-size:12px;color:var(--mu);padding:4px 0}
.dp-g button{border:0;background:none;border-radius:8px;height:34px;cursor:pointer;font-size:15px}
.dp-g button:hover:not(:disabled){background:var(--pl)}
.dp-g button.t{outline:2px solid var(--gold);outline-offset:-2px}
.dp-g button.s{background:var(--p);color:#fff}
.dp-g button:disabled{color:#c3cbc7;cursor:not-allowed}
.dp-g.dp-m{grid-template-columns:repeat(3,1fr);gap:4px}.dp-g.dp-m button{height:40px}
.dp-f{display:flex;justify-content:space-between;gap:6px;margin-top:8px}
.dp-f button{border:1px solid var(--bd);background:#fff;border-radius:8px;padding:5px 12px;cursor:pointer;font-size:14px}
.dp-f button:disabled{opacity:.45;cursor:not-allowed}
.ov.lb{z-index:250;background:rgba(10,20,17,.88);cursor:zoom-out;padding:16px 8px;flex-direction:column;align-items:center}
.ov.lb img{display:block;max-width:100%;height:auto;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.lb-x{position:fixed;top:12px;right:14px;background:#fff;color:#000;z-index:260}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(15,30,25,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:32px 12px;overflow-y:auto}
.ov.top{z-index:200;align-items:center}
.mdl{background:#fff;border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column}
.mdl.wide{max-width:920px}.mdl.sm{max-width:400px}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--bd)}
.mh h3{font-size:19px}
.x{background:none;border:0;font-size:20px;cursor:pointer;color:var(--mu);border-radius:6px;width:34px;height:34px}
.x:hover{background:#eef1ef}
.mb{padding:18px 20px}
.mf{padding:12px 20px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;background:#fafcfb;border-radius:0 0 14px 14px}
#toast-root{position:fixed;right:16px;bottom:16px;z-index:300;display:flex;flex-direction:column;gap:8px;max-width:min(92vw,380px)}
.toast{background:var(--pine);color:#fff;padding:11px 16px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:tin .2s}
.toast.err{background:var(--g3)}.toast.warn{background:#8a5f05}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- visit form / detail ---------- */
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.thumb{position:relative;width:96px;height:96px;border-radius:9px;overflow:hidden;border:1px solid var(--bd)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.65);color:#fff;border:0;border-radius:50%;width:24px;height:24px;cursor:pointer;line-height:1}
.infobox{background:var(--gold-l);border-radius:10px;padding:10px 14px;font-size:15px;margin-top:8px}
.dl{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:15px}
.dl dt{color:var(--mu)}.dl dd{margin:0}
@media(max-width:560px){.dl{grid-template-columns:1fr}.dl dt{margin-top:6px}}

/* ---------- report ---------- */
.rpwrap{overflow-x:auto;border:1px solid var(--bd);border-radius:var(--r);background:#e4e9e6;padding:14px}
#rpPaper{background:#fff;padding:28px 30px;margin:0 auto;color:#000;font-size:14px}
#rpPaper h2{text-align:center;font-size:19px}
#rpPaper .org{text-align:center;color:#333;font-size:14px}
#rpPaper .rsub{text-align:center;color:#333;margin:4px 0 12px}
#rpPaper .rsum{display:flex;flex-wrap:wrap;gap:6px 26px;margin:8px 0 12px;font-size:14px;border:1px solid #bbb;padding:8px 12px}
#rpPaper table{font-size:13px}
#rpPaper th,#rpPaper td{border:1px solid #999;padding:4px 6px}
#rpPaper th{background:#e8ede9;color:#000;white-space:normal}
#rpPaper .foot{margin-top:12px;font-size:12px;color:#444}
#rpPaper .mini{margin-bottom:6px}
#rpPaper .vsec{font-weight:600;font-size:15px;margin:14px 0 6px;padding-bottom:3px;border-bottom:2px solid #333}
#rpPaper .vb{display:grid;grid-template-columns:1fr 230px;gap:12px;border:1px solid #888;padding:8px 10px;margin-bottom:8px;font-size:13px;line-height:1.45}
#rpPaper .vb .vh{font-weight:600}
#rpPaper .vb .vn{font-weight:600;color:#0b4d3c;margin-bottom:2px}
#rpPaper .vb .ph{width:230px;height:172px;object-fit:cover;border:1px solid #999;display:block}
#rpPaper .vb .noph{display:flex;align-items:center;justify-content:center;color:#999;border:1px dashed #aaa;background:#fafafa}
#rpPaper .sign{margin-top:16px;font-size:13px}
#rpPaper .sign .cert{margin-bottom:10px}
#rpPaper .sign .sg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;text-align:center;line-height:1.9}
#rpPaper .sign .sg1{max-width:300px;margin:0 auto;text-align:center;line-height:1.9}
#rpPaper .cgp-title{text-align:center;font-size:18px;font-weight:700}
#rpPaper .cgp-sub{text-align:center;font-size:13.5px;color:#333;margin-top:2px}
#rpPaper .cgp-org{text-align:center;font-size:13.5px;color:#333;margin:6px 0 10px}
#rpPaper .cgp-meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 20px;font-size:14.5px;font-weight:600;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #ccc}
.cgp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:2px}
.cgp-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 10px;border:1px solid var(--bd);border-radius:16px;background:linear-gradient(180deg,#fff,var(--d-soft,#f4f8f6));cursor:pointer;text-align:center;transition:transform .15s,box-shadow .15s;font-family:inherit}
.cgp-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(18,41,31,.35);border-color:var(--p)}
.cgp-av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--p),#5fd39a);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px}
.cgp-nm{font-weight:600;font-size:14px;line-height:1.3}
.cgp-cnt{font-size:12.5px;color:var(--mu)}
@media print{
  body *{visibility:hidden}
  #rpPaper,#rpPaper *{visibility:visible}
  #rpPaper{position:absolute;left:0;top:0;width:100%!important;padding:0}
}

/* =====================================================================
   DASHBOARD v2 — mobile-first
   ใช้ร่วมกันทั้งหน้า Dashboard (เจ้าหน้าที่) และหน้าสาธารณะ (?public=1)
   ===================================================================== */
.dash{--d-line:#e2e9e5;--d-soft:#f4f8f6;--d-sh:0 1px 2px rgba(18,41,31,.05),0 12px 30px -18px rgba(18,41,31,.30);display:flex;flex-direction:column;gap:14px;font-variant-numeric:tabular-nums}
@keyframes dGrow{from{transform:scaleX(0)}}
@keyframes dRise{from{transform:scaleY(0)}}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}

/* ----- header ----- */
.d-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px 14px;flex-wrap:wrap}
.d-head h2{font-size:24px;font-weight:700;letter-spacing:-.2px;line-height:1.25}
.d-date{color:var(--mu);font-size:14px;margin-top:2px}
.d-fy{display:inline-flex;align-items:center;background:#fff;border:1px solid var(--d-line);border-radius:999px;padding:3px;box-shadow:var(--d-sh)}
.d-fy select{width:auto;min-height:38px;border:0;border-radius:999px;background:var(--pl);color:var(--p2);font-weight:600;padding:6px 14px;cursor:pointer}

/* ----- hero ----- */
.d-hero{position:relative;overflow:hidden;color:#fff;border-radius:22px;padding:22px 24px;box-shadow:var(--d-sh);
  background:radial-gradient(720px 300px at 100% -35%,rgba(95,211,154,.38),transparent 60%),radial-gradient(520px 260px at -8% 125%,rgba(224,165,38,.26),transparent 60%),linear-gradient(135deg,#0f2219 0%,#17362e 48%,#1d6b57 130%)}
.d-hero-main{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px 34px;align-items:center}
.d-total .n{display:flex;align-items:baseline;gap:8px}
.d-total b{font-size:64px;font-weight:700;line-height:1;letter-spacing:-1px}
.d-total small{font-size:18px;color:#b8cfc7}
.d-total .cap{color:#b8cfc7;margin-top:6px;font-size:15px;line-height:1.4;max-width:240px}
.d-seg{display:flex;gap:2px;height:16px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.14)}
.d-seg i{display:block;min-width:0;transform-origin:left;animation:dGrow .9s cubic-bezier(.2,.8,.2,1) both}
.d-lg{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:8px;margin-top:14px}
.d-lgi{min-width:0;padding:9px 12px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}
.d-lgi .t{display:flex;align-items:center;gap:7px;font-size:14px;line-height:1.3;color:#dcefe8}
.d-lgi .v{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 6px;margin-top:2px}
.d-lgi .v b{font-size:24px;font-weight:700;line-height:1.15}
.d-lgi .v span{font-size:13px;color:#b8cfc7}
.d-lgi .v em{font-style:normal}
.d-ins{display:flex;gap:10px;align-items:flex-start;margin-top:16px;padding:11px 14px;border-radius:14px;font-size:14.5px;line-height:1.55;color:#dcefe8;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.d-ins .sp{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:9px;font-size:13px;background:linear-gradient(135deg,#5fd39a,#e0a526);color:#12291f}
.d-ins b{color:#fff}

/* ----- KPI ----- */
.d-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:12px}
.d-kpi{display:flex;align-items:center;gap:12px;min-width:0;padding:14px 16px;border-radius:18px;background:#fff;border:1px solid var(--d-line);box-shadow:var(--d-sh)}
.d-kpi .ic{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:14px;font-size:21px;background:var(--t,var(--pl))}
.d-kpi .bd{min-width:0}
.d-kpi .kv{font-size:28px;font-weight:700;line-height:1.1}
.d-kpi .kv small{margin-left:4px;font-size:14px;font-weight:500;color:var(--mu)}
.d-kpi .kl{font-size:14.5px;line-height:1.3;color:#3d4d47}
.d-kpi .ks{margin-top:2px;font-size:12.5px;line-height:1.35;color:var(--mu)}

/* ----- grid + card ----- */
.d-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.d-grid>.c4{grid-column:span 4}.d-grid>.c6{grid-column:span 6}.d-grid>.c8{grid-column:span 8}.d-grid>.c12{grid-column:span 12}
@media(max-width:1100px){.d-grid>.c4,.d-grid>.c8{grid-column:span 12}}
@media(max-width:820px){.d-grid>.c6{grid-column:span 12}}
.d-card{min-width:0;padding:16px 18px 18px;border-radius:18px;background:#fff;border:1px solid var(--d-line);box-shadow:var(--d-sh)}
.d-ch{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.d-ci{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:11px;font-size:17px;background:var(--pl)}
.d-ch h3{font-size:16.5px;line-height:1.3}
.d-ch small{display:block;margin-top:1px;font-size:13px;font-weight:400;color:var(--mu)}
.d-card .empty{padding:26px 10px;border-radius:14px;background:var(--d-soft)}

/* ----- เกณฑ์การเยี่ยมตามกลุ่ม ----- */
.gc-sum{display:flex;align-items:center;gap:16px;margin-bottom:12px;padding:12px 14px;border-radius:14px;background:var(--d-soft);border:1px solid var(--d-line)}
.gc-big{flex:none;font-size:34px;font-weight:700;line-height:1;color:var(--p2)}
.gc-big small{margin-left:1px;font-size:16px;font-weight:600}
.gc-sb{flex:1;min-width:0}
.gc-bar{height:10px;border-radius:999px;background:#e3eae6;overflow:hidden}
.gc-bar i{display:block;height:100%;border-radius:999px;transform-origin:left;animation:dGrow .9s cubic-bezier(.2,.8,.2,1) both}
.gc-sum .gc-bar i{background:linear-gradient(90deg,#1d6b57,#5fd39a)}
.gc-st{margin-top:6px;font-size:13.5px;line-height:1.45;color:var(--mu)}
.gc-st b{color:var(--tx)}
.gc-wrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gc{position:relative;padding:12px 14px 12px 18px;border-radius:14px;border:1px solid var(--d-line);background:#fff}
.gc::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
.gc .dot{background:var(--c)}
.gc-h{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px}
.gc-h b{font-size:15px}
.gc-q{margin-left:auto;padding:1px 10px;border-radius:999px;font-size:12.5px;white-space:nowrap;color:var(--mu);background:var(--d-soft)}
.gc-m{display:flex;align-items:center;gap:12px;margin:10px 0 12px}
.gc-p{min-width:62px;font-size:28px;font-weight:700;line-height:1}
.gc-p small{font-size:14px;font-weight:600;color:var(--mu)}
.gc-m .gc-bar{flex:1}
.gc-m .gc-bar i{background:var(--c)}
.gc-s{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-top:10px;text-align:center;border-top:1px dashed var(--d-line)}
.gc-s b{display:block;font-size:18px;line-height:1.2}
.gc-s span{display:block;margin-top:1px;font-size:11.5px;line-height:1.25;color:var(--mu)}
.gc-note{margin-top:10px;font-size:13px;color:var(--mu);line-height:1.5}
@media(max-width:600px){.gc-wrap{grid-template-columns:1fr}}

/* ----- ภาพเกณฑ์ LTC ----- */
.d-ltc{display:flex;flex-direction:column}
.ltc-thumb{position:relative;display:block;width:100%;flex:1;min-height:240px;padding:0;border:1px solid var(--d-line);border-radius:14px;overflow:hidden;cursor:zoom-in;background:#e6f1fa}
.ltc-thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;transition:transform .3s}
.ltc-thumb:hover img{transform:scale(1.04)}
.ltc-thumb span{position:absolute;left:0;right:0;bottom:0;padding:28px 12px 10px;color:#fff;font-size:14px;font-weight:500;text-align:center;background:linear-gradient(transparent,rgba(23,54,46,.88))}
@media(max-width:600px){.ltc-thumb{min-height:200px}}

/* ----- กราฟแท่งรายเดือน ----- */
.d-cw{overflow-x:auto}
.d-cols{display:flex;align-items:stretch;gap:6px;height:200px;min-width:300px}
.d-cols .col{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.d-cols .cv{height:18px;font-size:12px;font-weight:600;color:var(--mu)}
.d-cols .cbw{flex:1;display:flex;align-items:flex-end;width:100%;min-height:0;border-bottom:1px solid var(--d-line)}
.d-cols .cb{width:100%;max-width:34px;margin:0 auto;min-height:3px;border-radius:8px 8px 0 0;background:linear-gradient(180deg,#5fd39a,#1d6b57);transform-origin:bottom;animation:dRise .8s cubic-bezier(.2,.8,.2,1) both}
.d-cols .col.cur .cb{background:linear-gradient(180deg,#f3cf6b,#e0a526)}
.d-cols .cl{margin-top:5px;font-size:12.5px;white-space:nowrap;color:var(--mu)}
.d-cols .col.cur .cl{font-weight:700;color:var(--tx)}
@media(max-width:560px){.d-cols{gap:2px;height:176px}.d-cols .cl{font-size:11px;letter-spacing:-.2px}.d-cols .cv{font-size:11px}}

/* ----- แท่งแนวนอน ----- */
.hbs{display:grid;gap:11px}
.hbs.two{grid-template-columns:1fr 1fr;column-gap:32px}
@media(max-width:820px){.hbs.two{grid-template-columns:1fr}}
.hb{display:grid;grid-template-columns:minmax(72px,130px) minmax(0,1fr) 36px;gap:10px;align-items:center;font-size:14.5px}
.hb .hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .ht{height:10px;border-radius:999px;overflow:hidden;background:#e7eee9}
.hb .hf{height:100%;border-radius:999px;background:linear-gradient(90deg,#1d6b57,#5fd39a);transform-origin:left;animation:dGrow .9s cubic-bezier(.2,.8,.2,1) both}
.hb .hn{text-align:right;font-weight:700}
@media(max-width:480px){.hb{grid-template-columns:minmax(64px,104px) minmax(0,1fr) 30px;gap:8px;font-size:14px}}

/* ----- รายการ ----- */
.d-list{list-style:none;margin:0;padding:0}
.d-list li{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;padding:10px 0;border-bottom:1px solid var(--d-line)}
.d-list li:first-child{padding-top:0;min-height:44px}
.d-list li:last-child{border-bottom:0;padding-bottom:0}
.d-list .l{min-width:0}
.d-list .l a{font-weight:600;text-decoration:none;color:var(--tx)}
.d-list .l a:hover{color:var(--p)}
.d-list .l .s{display:block;margin-top:1px;font-size:13px;line-height:1.4;color:var(--mu)}
.d-list .r{flex:none;display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:6px;max-width:55%}

/* =====================================================================
   ผลงานการเยี่ยมของ CG รายเดือน
   ===================================================================== */
.d-card.cgm{padding:0;overflow:hidden;border-color:#cfe3da;box-shadow:0 10px 30px -14px rgba(23,54,46,.35)}
.cgm-hd{position:relative;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;padding:20px 24px 0;color:#fff}
.cgm-tt{display:flex;gap:12px;align-items:center;min-width:0}
.cgm-sp{flex:none;display:grid;place-items:center;width:42px;height:42px;border-radius:13px;font-size:20px;background:linear-gradient(135deg,#5fd39a,#e0a526);color:#12291f;box-shadow:0 6px 18px -6px rgba(95,211,154,.7)}
.cgm-hd h3{color:#fff;font-size:20px;margin:0;line-height:1.3}
.cgm-sub{color:#b8cfc7;font-size:14px;margin-top:1px}
.cgm-sel{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-radius:999px;padding:4px 6px 4px 14px;font-size:14px;color:#dcefe8}
.cgm-sel select{width:auto;min-width:190px;min-height:38px;border:0;border-radius:999px;padding:7px 14px;background:#fff;color:#17362e;font-weight:600;cursor:pointer}
.cgm-sum{display:flex;flex-wrap:wrap;gap:22px;align-items:center;padding:18px 24px 20px;color:#fff}
.cgm-top{background:radial-gradient(900px 260px at 100% -40%,rgba(95,211,154,.38),transparent 60%),radial-gradient(600px 240px at -10% 120%,rgba(224,165,38,.22),transparent 60%),linear-gradient(135deg,#12291f 0%,#17362e 40%,#1d6b57 100%)}
.cgm-ring{--pc:0;position:relative;width:104px;height:104px;border-radius:50%;display:grid;place-items:center;text-align:center;background:conic-gradient(#5fd39a calc(var(--pc)*1%),rgba(255,255,255,.16) 0);flex:none}
.cgm-ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:#17362e}
.cgm-ring>div{position:relative;line-height:1.1}
.cgm-ring b{font-size:26px;font-weight:700;display:block}
.cgm-ring small{font-size:11.5px;color:#b8cfc7}
.cgm-stats{display:grid;grid-template-columns:repeat(4,minmax(96px,1fr));gap:10px;flex:1;min-width:280px}
.cgm-st{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:10px 14px}
.cgm-st b{display:block;font-size:26px;font-weight:700;line-height:1.15}
.cgm-st span{font-size:13.5px;color:#b8cfc7}
.cgm-ins{margin:16px 24px 0;padding:10px 14px;border-radius:12px;font-size:14.5px;line-height:1.55;background:linear-gradient(90deg,#eaf7f0,#f7fbf9);border:1px solid #cfe8db;color:#1d4f40}
.cgm-ins b{color:#12291f}
.cgm-tool{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:14px 24px 6px}
.cgm-tool .mu{font-size:14px}
.cgm-seg{display:inline-flex;background:#eef3f0;border-radius:999px;padding:3px}
.cgm-seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-size:14px;cursor:pointer;color:var(--mu)}
.cgm-seg button.on{background:#fff;color:var(--p2);font-weight:600;box-shadow:0 2px 8px -3px rgba(23,54,46,.35)}
.cgm-tb{padding:0 14px 6px}
.cgm-h,.cgm-r{display:grid;grid-template-columns:minmax(210px,2.3fr) repeat(4,minmax(78px,.7fr)) minmax(170px,2fr);gap:10px;align-items:center;padding:10px}
.cgm-h{font-size:13.5px;color:var(--mu);font-weight:600;border-bottom:1px solid var(--bd)}
.cgm-h>:not(:first-child):not(:last-child){text-align:center}
.cgm-r{border-radius:14px;transition:background .15s;animation:cgmIn .45s both}
.cgm-r:hover{background:#f3f8f5}
@keyframes cgmIn{from{opacity:0;transform:translateY(6px)}}
.cgm-nm{display:flex;gap:11px;align-items:center;min-width:0}
.cgm-av{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px}
.cgm-nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cgm-cd{display:inline-block;margin-top:1px;font-size:12px;letter-spacing:.4px;padding:0 8px;border-radius:999px;background:#eef3f0;color:var(--mu)}
.cgm-c{text-align:center;font-size:17px;font-weight:600}
.cgm-c.z{color:#b3bdb8;font-weight:400}
.cgm-pill{display:inline-block;min-width:44px;padding:1px 12px;border-radius:999px;font-size:15px;font-weight:700}
.cgm-pg{display:flex;align-items:center;gap:10px}
.cgm-bar{flex:1;height:12px;border-radius:999px;background:#e8eeeb;overflow:hidden}
.cgm-bar i{display:block;height:100%;border-radius:999px;transform-origin:left;animation:dGrow .9s cubic-bezier(.2,.8,.2,1) both}
.cgm-pc{min-width:46px;text-align:right;font-weight:700;font-size:15px}
.cgm-ft{padding:6px 24px 16px;font-size:13.5px;line-height:1.5;color:var(--mu)}
@media(max-width:900px){.cgm-stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){
  .cgm-hd{padding:16px 16px 0}
  .cgm-hd h3{font-size:18px}
  .cgm-sel{width:100%;justify-content:space-between}
  .cgm-sel select{flex:1;min-width:0}
  .cgm-sum{flex-wrap:nowrap;gap:14px;padding:14px 16px 16px}
  .cgm-ring{width:84px;height:84px}
  .cgm-ring::before{inset:8px}
  .cgm-ring b{font-size:21px}
  .cgm-ring small{font-size:10.5px}
  .cgm-stats{min-width:0;gap:8px}
  .cgm-st{padding:8px 10px;border-radius:12px}
  .cgm-st b{font-size:21px}
  .cgm-st span{font-size:12px}
  .cgm-ins{margin:14px 16px 0}
  .cgm-tool{flex-direction:column;align-items:stretch;padding:14px 16px 6px;gap:6px}
  .cgm-seg{display:flex}
  .cgm-seg button{flex:1;padding:7px 4px;font-size:13px}
  .cgm-tb{padding:0 12px 4px}
  .cgm-h{display:none}
  .cgm-r{grid-template-columns:repeat(4,1fr);gap:8px;border:1px solid var(--d-line);margin-bottom:10px;padding:12px}
  .cgm-r .cgm-nm,.cgm-r .cgm-pg{grid-column:1/-1}
  .cgm-c{padding:6px 2px;border-radius:10px;font-size:16px;background:var(--d-soft)}
  .cgm-c::before{content:attr(data-l);display:block;margin-bottom:1px;font-size:11.5px;font-weight:400;color:var(--mu)}
  .cgm-ft{padding:6px 16px 16px}
}

/* ----- จอเล็ก ----- */
@media(max-width:600px){
  .dash{gap:12px}
  .d-head h2{font-size:21px}
  .d-hero{padding:18px 16px;border-radius:20px}
  .d-hero-main{grid-template-columns:1fr;gap:14px}
  .d-total b{font-size:52px}
  .d-total .cap{max-width:none}
  .d-lg{grid-template-columns:1fr 1fr;gap:8px}
  .d-lgi{padding:8px 10px}
  .d-lgi .v b{font-size:22px}
  .d-lgi .v em{display:none}
  .d-lgi:last-child:nth-child(odd){grid-column:1/-1}
  .d-kpis{grid-template-columns:1fr 1fr;gap:10px}
  .d-kpi{flex-direction:column;align-items:flex-start;gap:8px;padding:12px}
  .d-kpi .ic{width:38px;height:38px;border-radius:12px;font-size:18px}
  .d-kpi .kv{font-size:26px}
  .d-kpi .kl{font-size:13.5px}
  .d-grid{gap:12px}
  .d-card{padding:14px 14px 16px;border-radius:16px}
  .d-list .r{max-width:52%}
}

/* =====================================================================
   VISIT FORM v2 — บันทึกการเยี่ยมใหม่ / แก้ไข (mobile-first)
   ===================================================================== */
.vf{--vf-line:#e2e9e5;--vf-soft:#f4f8f6;--vf-fld:#d3dcd7;--vf-sh:0 1px 2px rgba(18,41,31,.05),0 12px 30px -18px rgba(18,41,31,.30);max-width:860px;margin:0 auto;padding-bottom:104px;display:flex;flex-direction:column;gap:14px;font-variant-numeric:tabular-nums}
.vf-ic{width:20px;height:20px;flex:none}
body:has(.vf) #toast-root{bottom:calc(88px + env(safe-area-inset-bottom,0px))}

/* ----- header ----- */
.vf-hd{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;padding:14px 18px 14px 14px;border-radius:22px;color:#fff;box-shadow:var(--vf-sh);
  background:radial-gradient(520px 220px at 100% -40%,rgba(95,211,154,.36),transparent 60%),radial-gradient(360px 200px at -8% 130%,rgba(224,165,38,.14),transparent 60%),linear-gradient(135deg,#0f2219 0%,#17362e 50%,#1d6b57 130%)}
.vf-back{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:15px;border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.1);color:#fff;cursor:pointer}
.vf-back:hover{background:rgba(255,255,255,.2)}
.vf-hd h2{font-size:20px;font-weight:700;line-height:1.25}
.vf-hd p{margin:2px 0 0;font-size:13.5px;line-height:1.4;color:#b8cfc7}

/* ----- section nav ----- */
.vf-navw{position:sticky;top:var(--topH,61px);z-index:25;margin:-6px 0;padding:8px 0 6px;background:linear-gradient(var(--bg) 75%,rgba(238,241,238,0))}
.vf-nav{display:flex;gap:4px;overflow-x:auto;padding:5px;border-radius:18px;background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--vf-line);box-shadow:var(--vf-sh);scrollbar-width:none}
.vf-nav::-webkit-scrollbar{display:none}
.vf-nav button{flex:none;min-height:40px;padding:0 15px;border:0;border-radius:13px;background:none;color:#4a5b54;font-size:14.5px;cursor:pointer;white-space:nowrap}
.vf-nav button.on{background:var(--pine);color:#fff;font-weight:600}

/* ----- cards ----- */
.vf-card{scroll-margin-top:calc(var(--topH,61px) + 72px);padding:16px;border-radius:20px;background:#fff;border:1px solid var(--vf-line);box-shadow:var(--vf-sh)}
.vf-ch{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.vf-ci{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:var(--pl);color:var(--p2)}
.vf-ct{min-width:0}
.vf-ct h3{font-size:17px;line-height:1.3}
.vf-ct small{display:block;margin-top:1px;font-size:13px;line-height:1.35;color:var(--mu)}
.vf-stp{margin-left:auto;flex:none;padding:2px 11px;border-radius:999px;font-size:12.5px;white-space:nowrap;color:var(--mu);background:var(--vf-soft);border:1px solid var(--vf-line)}
.vf-stp.ok{color:#1d7040;background:#e3f5e9;border-color:#bfe4cb;font-weight:600}
.vf-sub{display:flex;align-items:center;gap:8px;margin:16px 0 8px;font-size:15px}
.vf-sub:first-of-type{margin-top:0}
.vf-cnt{padding:0 9px;border-radius:999px;font-size:12.5px;background:var(--pl);color:var(--p2)}

/* ----- fields ----- */
.vf-g{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.vf-g .full{grid-column:1/-1}
.vf-g.two{grid-template-columns:1fr}
.vf .f{display:block;min-width:0}
.vf label.f>span,.vf .vf-lb{display:block;margin:0 0 6px;font-size:14px;font-weight:500;color:#3d4d47}
.vf .vf-in,.vf select,.vf textarea,.vf .dp-v{width:100%;min-height:50px;padding:10px 14px;border:1.5px solid var(--vf-fld);border-radius:14px;background-color:#f8faf9;font-size:16px;transition:border-color .15s,background-color .15s,box-shadow .15s}
.vf textarea{min-height:88px;resize:vertical;line-height:1.5}
.vf .vf-in:focus,.vf select:focus,.vf textarea:focus,.vf .dp-v:focus{outline:0;background-color:#fff;border-color:var(--p);box-shadow:0 0 0 4px rgba(29,107,87,.16)}
.vf select{-webkit-appearance:none;appearance:none;padding-right:42px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='%2366756f' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 14px center}
.vf .dp-v{padding-right:42px}
.vf .dp{display:block}
.vf .f.vf-err select,.vf .f.vf-err .dp-v,.vf .f.vf-err .vf-in{border-color:var(--g3);box-shadow:0 0 0 4px rgba(204,75,60,.15)}
.vf .vf-in[type=number]{-moz-appearance:textfield}
.vf .vf-in[type=number]::-webkit-outer-spin-button,.vf .vf-in[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* ----- ประเภทการเยี่ยม ----- */
.vf-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:16px;background:#e9efec}
.vf-seg button{min-height:46px;padding:4px 6px;border:0;border-radius:12px;background:none;color:#4a5b54;font-size:15px;line-height:1.2;cursor:pointer}
.vf-seg button[aria-checked=true]{background:#fff;color:var(--p2);font-weight:600;box-shadow:0 2px 8px -3px rgba(23,54,46,.45)}
.vf-seg button[data-v=urgent][aria-checked=true]{color:#a3362a}

/* ----- ผู้สูงอายุที่เลือก ----- */
.vf-el{margin-top:14px;padding:14px;border-radius:18px;background:linear-gradient(135deg,#eaf6f1,#f7fbf9);border:1px solid #cfe3da}
.vf-el-top{display:flex;align-items:center;gap:12px}
.vf-av{flex:none;display:grid;place-items:center;width:48px;height:48px;border-radius:16px;color:#fff;background:var(--c,#1d6b57)}
.vf-av .vf-ic{width:24px;height:24px}
.vf-el-nm{min-width:0}
.vf-el-nm b{display:block;font-size:17px;line-height:1.3}
.vf-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.vf-tags .badge{background:#fff;border:1px solid rgba(0,0,0,.06)}
.vf-tags .b-g1{background:#dff3e6}.vf-tags .b-g2{background:#fbeccb}.vf-tags .b-g3{background:#f8dcd8}
.vf-q{margin-top:12px;padding:12px 14px;border-radius:14px;background:#fff;border:1px solid var(--vf-line)}
.vf-q-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:14.5px}
.vf-q-h b{font-size:20px}
.vf-q-h strong{font-size:14px;color:#8a5f05}
.vf-q.ok .vf-q-h strong{color:#1d7040}
.vf-q.none{font-size:14px;color:var(--mu);background:#f1f3f2}
.vf-pb{height:10px;margin:10px 0 6px;border-radius:999px;background:#e5ece8;overflow:hidden}
.vf-pb i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#e0a526,#f3cf6b);transition:width .3s}
.vf-q.ok .vf-pb i,.vf-rep .vf-pb i{background:linear-gradient(90deg,#1d6b57,#5fd39a)}
.vf-cap{font-size:12.5px;color:var(--mu)}
.vf-rows{display:grid;gap:8px;margin:12px 0 0;font-size:14.5px}
.vf-rows div{display:grid;grid-template-columns:92px minmax(0,1fr);gap:8px}
.vf-rows dt{color:var(--mu)}
.vf-rows dd{margin:0;overflow-wrap:anywhere}
.vf-rep{margin-top:12px;border-radius:16px;border:1px solid var(--vf-line);background:#fff}
.vf-rep summary{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 14px;cursor:pointer;list-style:none}
.vf-rep summary::-webkit-details-marker{display:none}
.vf-rep .vf-ci{width:36px;height:36px;border-radius:12px}
.vf-rs{flex:1;min-width:0;line-height:1.35}
.vf-rs b{display:block;font-size:15px}
.vf-rs small{display:block;font-size:12.5px;color:var(--mu)}
.vf-pct{flex:none;font-size:20px;font-weight:700;color:var(--p2)}
.vf-chev{color:var(--mu);transition:transform .2s}
.vf-rep[open] .vf-chev{transform:rotate(180deg)}
.vf-rep>:not(summary){margin-left:14px;margin-right:14px}
.vf-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vf-tiles>div{padding:10px 4px;border-radius:12px;text-align:center}
.vf-tiles b{display:block;font-size:26px;line-height:1.2}
.vf-tiles span{font-size:12.5px;color:var(--mu)}
.vf-tiles .t1{background:#e8f0fb}.vf-tiles .t1 b{color:#2a5ea8}
.vf-tiles .t2{background:#e3f5e9}.vf-tiles .t2 b{color:#1d7040}
.vf-tiles .t3{background:#fbeccb}.vf-tiles .t3 b{color:#8a5f05}
.vf-note{margin:0 14px 12px;font-size:13px;color:var(--mu)}
.vf-rep>.vf-pb{margin-bottom:10px}
.vf-rep>.vf-tiles{margin-top:2px}
.vf-rep[open]{padding-bottom:4px}

/* ----- สัญญาณชีพ ----- */
.vf-vit{grid-template-columns:1fr 1fr}
.vf-w{position:relative}
.vf label.f>.vf-w{margin:0;font-size:inherit;font-weight:inherit;color:inherit}
.vf-w .vf-in{padding-right:66px}
.vf-w em{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-style:normal;font-size:13px;color:var(--mu);pointer-events:none}
.vf-bpw em{flex:none;font-style:normal;font-size:13px;color:var(--mu)}
.vf-bpw{position:relative;display:flex;align-items:center;gap:10px}
.vf-bpw .vf-in{flex:1;min-width:0;text-align:center;font-size:20px;font-weight:600}
.vf-bpw i{font-style:normal;font-size:24px;color:var(--mu)}
.vf-bpw .vf-in::placeholder{font-size:15px;font-weight:400;color:#93a29b}

/* ----- ADL ----- */
.vf-adl-sum{display:flex;align-items:center;gap:16px;margin-bottom:12px;padding:12px 14px;border-radius:16px;background:var(--vf-soft);border:1px solid var(--vf-line)}
.vf-mini{font-size:12.5px;color:var(--mu)}
.vf-adl-sum #adlTot{display:block;font-size:26px;line-height:1.15;white-space:nowrap}
.vf-adl-r{flex:1;min-width:0}
.vf-adl-r #adlGrp{min-height:24px;font-size:14px}
.vf-dots{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:6px}
.vf-dots i{height:6px;border-radius:999px;background:#dbe4df;transition:background-color .2s}
.vf-dots i.on{background:var(--p)}
.vf-lnk{flex:none;min-height:40px;padding:0 12px;border:0;border-radius:12px;background:none;color:#a3362a;font-size:14px;cursor:pointer}
.vf-lnk:hover{background:#fbe4e1}
.vf-ai{scroll-margin-top:calc(var(--topH,61px) + 150px);border:1.5px solid var(--vf-line);border-radius:16px;background:#fff;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.vf-ai+.vf-ai{margin-top:8px}
.vf-ai.open{border-color:#9fcdbd;box-shadow:0 0 0 4px rgba(29,107,87,.08)}
.vf-ai-h{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:10px 14px;border:0;background:none;text-align:left;cursor:pointer;color:inherit}
.vf-ai-n{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#e9efec;color:#4a5b54;font-size:13.5px;font-weight:700}
.vf-ai.done .vf-ai-n{background:var(--p);color:#fff}
.vf-ai-t{flex:1;min-width:0;line-height:1.3}
.vf-ai-t b{display:block;font-size:15.5px;font-weight:600}
.vf-ai-t small{display:block;font-size:13px;color:var(--mu)}
.vf-ai.done .vf-ai-t small{display:none}
.vf-ai-t .vf-en{font-style:normal;font-weight:400;font-size:13.5px;color:var(--mu);white-space:nowrap}
.vf-ai-v{display:none;margin-top:2px;font-size:13.5px;color:var(--p2);font-weight:500}
.vf-ai.done .vf-ai-v{display:block}
.vf-ai-s{flex:none;font-size:13px;font-weight:700;color:var(--p2)}
.vf-ai-s:empty{display:none}
.vf-ai.open .vf-chev{transform:rotate(180deg)}
.vf-ai-o{display:none;flex-direction:column;gap:8px;padding:2px 12px 12px}
.vf-ai.open .vf-ai-o{display:flex}
.vf-op{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:8px 12px;border:1.5px solid var(--vf-fld);border-radius:14px;background:#fff;color:inherit;text-align:left;font-size:15px;line-height:1.35;cursor:pointer}

.vf-op[aria-checked=true]{border-color:var(--p);background:var(--pl);font-weight:600}
.vf-op[aria-checked=true] b{background:var(--p);color:#fff}

.vf .chips{gap:8px}
.vf .chip{position:relative}
.vf .chip span{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 15px;border:1.5px solid var(--vf-fld);border-radius:999px;background:#fff;font-size:15px;line-height:1.25;transition:background-color .15s,border-color .15s}

.vf .warn .chip input:checked+span{background:var(--gold-l);border-color:var(--gold);color:#6f4d04}

.vf-sw{position:relative;display:flex;align-items:center;gap:12px;min-height:62px;padding:10px 14px;border:1.5px solid var(--vf-fld);border-radius:16px;background:#fff;cursor:pointer}
.vf-sw input{position:absolute;opacity:0;pointer-events:none}
.vf-sw .tr{flex:none;position:relative;width:48px;height:28px;border-radius:999px;background:#c5d0ca;transition:background-color .2s}
.vf-sw .tr::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.vf-sw input:checked~.tr{background:var(--p)}
.vf-sw input:checked~.tr::after{transform:translateX(20px)}
.vf-sw input:focus-visible~.tr{outline:3px solid var(--gold);outline-offset:2px}
.vf-sw:has(input:checked){border-color:var(--p);background:var(--pl)}

.vf-sw .tx b{display:block;font-weight:600}
.vf-sw .tx small{display:block;font-size:13px;color:var(--mu)}

.vf-ph{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.vf-th{position:relative;aspect-ratio:1;overflow:hidden;border-radius:14px;border:1px solid var(--vf-line);background:var(--vf-soft)}
.vf-th img{display:block;width:100%;height:100%;object-fit:cover}
.vf-th button{position:absolute;top:4px;right:4px;display:grid;place-items:center;width:32px;height:32px;border:0;border-radius:50%;background:rgba(15,34,25,.72);color:#fff;cursor:pointer}
.vf-th button .vf-ic{width:16px;height:16px}
.vf-add{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:2px dashed #aebfb7;border-radius:14px;background:var(--vf-soft);color:var(--p2);font-size:13px;cursor:pointer}
.vf-add:hover{background:var(--pl)}
.vf-add .vf-ic{width:24px;height:24px}
.vf-btn2{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border:1.5px solid var(--p);border-radius:14px;background:#fff;color:var(--p2);font-weight:600;cursor:pointer}
.vf-btn2:hover{background:var(--pl)}

/* ----- แถบบันทึกด้านล่าง ----- */
.vf-bar{position:fixed;left:0;right:0;bottom:0;z-index:28;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--vf-line);box-shadow:0 -12px 30px -20px rgba(18,41,31,.45)}

.vf-bar .btn{justify-content:center;min-height:54px;border-radius:16px;font-size:16.5px}
.vf-bar .btn-o{flex:0 0 auto;padding:0 22px}
.vf-bar .btn-d{flex:0 0 auto;padding:0 18px;gap:6px}
.vf-bar .btn-d .vf-ic{width:20px;height:20px}
.v-act{white-space:nowrap;position:sticky;right:0;background:#fff;box-shadow:-8px 0 10px -8px rgba(18,41,31,.25)}
th.v-act{background:#f4f8f6}
.vf-bar #vSave{flex:1;font-weight:600;gap:8px}
.vf-bar #vSave .vf-ic{width:22px;height:22px}

@media(max-width:720px){

}
@media(min-width:721px){
  .vf-card{padding:20px 22px}

  .vf-vit .full{grid-column:span 2}
  .vf-ph{grid-template-columns:repeat(4,120px)}
  .vf-hd{padding:16px 22px 16px 16px}
}
@media(min-width:961px){
  .vf-bar{left:250px;padding-left:28px;padding-right:28px}
}
@media(max-width:360px){
  .vf-seg button{font-size:14px}
  .vf-rows div{grid-template-columns:78px minmax(0,1fr)}
}

const TAI_OPTS = ['B3', 'C2', 'C3', 'C4', 'I1', 'I2', 'I3'];
const taiGroup = t => ({ B3: 'กลุ่มที่ 1 (B3)', C2: 'กลุ่มที่ 2 (C2-C4)', C3: 'กลุ่มที่ 2 (C2-C4)', C4: 'กลุ่มที่ 2 (C2-C4)', I3: 'กลุ่มที่ 3 (I3)', I1: 'กลุ่มที่ 4 (I1,I2)', I2: 'กลุ่มที่ 4 (I1,I2)' })[t] || '';
const DEP = {
  1: { label: 'กลุ่มที่ 1 (B3)', q: 2, color: '#2e9d5b' },
  2: { label: 'กลุ่มที่ 2 (C2-C4)', q: 4, color: '#2f6fb5' },
  3: { label: 'กลุ่มที่ 3 (I3)', q: 8, color: '#f08c1a' },
  4: { label: 'กลุ่มที่ 4 (I1,I2)', q: 8, color: '#d94a3a' }
};
const depNo = e => { const m = taiGroup(e && e.tai).match(/\d/); return m ? +m[0] : 0; };
const depQuota = e => (DEP[depNo(e)] || {}).q || 0;
const monthVisits = (D, ym, exclude) => { const m = {}; D.vs.forEach(v => { if (v.date.startsWith(ym) && v.id !== exclude) m[v.elderId] = (m[v.elderId] || 0) + 1; }); return m; };
const depBadge = e => { const g = depNo(e); return g ? `<span class="badge" style="background:${DEP[g].color}22;color:${DEP[g].color}">${DEP[g].label}</span>` : '<span class="mu sm">ยังไม่ระบุ TAI</span>'; };
const quotaBadge = (e, n) => { const q = depQuota(e); return q ? `<span class="badge ${n >= q ? 'b-g1' : n > 0 ? 'b-g2' : 'b-g3'}">${n}/${q} ครั้ง</span>` : '<span class="mu sm">-</span>'; };
function quotaText(e, n) { const g = depNo(e); return g ? DEP[g].label + ' · เกณฑ์เยี่ยม ' + DEP[g].q + ' ครั้ง/เดือน · เดือนนี้เยี่ยมแล้ว ' + n + ' ครั้ง' : 'ยังไม่ระบุ TAI (ยังไม่มีเกณฑ์การเยี่ยม)'; }
function showLtc() {
  const d = document.createElement('div'); d.className = 'ov lb'; d.title = 'คลิกเพื่อปิด';
  d.innerHTML = '<button class="x lb-x" aria-label="ปิด">✕</button><img src="' + LTC_IMG + '" alt="เกณฑ์การเยี่ยมผู้ป่วยระยะยาว (LTC)" width="1024" height="1536">';
  d.onclick = () => d.remove(); document.body.appendChild(d);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const l = document.querySelector('.ov.lb'); if (l) l.remove(); } });

let DP = null;

  extra = extra || ''; const dis = /(^|\s)disabled(\s|$)/.test(extra), min = (extra.match(/\bmin="([^"]*)"/) || [])[1] || '', max = (extra.match(/\bmax="([^"]*)"/) || [])[1] || '', oc = (extra.match(/onchange="([^"]*)"/) || [])[1] || '';

}

function dpOpen(id) {
  const h = $(id); if (!h || h.disabled) return; dpClose();
  const mode = h.dataset.mode, v = h.value || '', now = today(), min = h.dataset.min || '', max = h.dataset.max || '';
  let base = v || now; if (!v && max && now > max) base = max; if (!v && min && now < min) base = min;
  DP = { id, mode, y: +base.slice(0, 4), m: +base.slice(5, 7) - 1, min, max };
  const el = document.createElement('div'); el.id = 'dpPop'; el.className = 'dp-pop'; document.body.appendChild(el);
  dpDraw(); dpPlace();
  setTimeout(() => { document.addEventListener('mousedown', dpOutside, true); document.addEventListener('touchstart', dpOutside, true); window.addEventListener('scroll', dpScroll, true); window.addEventListener('resize', dpClose); }, 0);
}
const dpOutside = e => { if (!e.target.closest('#dpPop') && !e.target.closest('.dp')) dpClose(); };
const dpScroll = e => { if (!e.target.closest || !e.target.closest('#dpPop')) dpClose(); };

}
const dp2 = n => String(n).padStart(2, '0');
function dpDraw() {
  const el = $('dpPop'); if (!el || !DP) return;
  const { mode, y, m, min, max } = DP, sel = $(DP.id).value, now = today(), yNow = +now.slice(0, 4);
  const y0 = Math.min(min ? +min.slice(0, 4) : yNow - 110, y), y1 = Math.max(max ? +max.slice(0, 4) : yNow + 10, y);
  let yo = ''; for (let i = y1; i >= y0; i--) yo += `<option value="${i}" ${i === y ? 'selected' : ''}>พ.ศ. ${i + 543}</option>`;
  let h = `<div class="dp-h"><button type="button" onclick="dpNav(-1)" aria-label="ก่อนหน้า">‹</button>${mode === 'date' ? `<select aria-label="เดือน" onchange="DP.m=+this.value;dpDraw()">${MONTHS_F.map((n, i) => `<option value="${i}" ${i === m ? 'selected' : ''}>${n}</option>`).join('')}</select>` : ''}<select aria-label="ปี พ.ศ." onchange="DP.y=+this.value;dpDraw()">${yo}</select><button type="button" onclick="dpNav(1)" aria-label="ถัดไป">›</button></div>`;

    for (let i = 0; i < first; i++) h += '<span></span>';
    for (let d = 1; d <= n; d++) { const iso = y + '-' + dp2(m + 1) + '-' + dp2(d), off = (min && iso < min) || (max && iso > max); h += `<button type="button" class="${iso === sel ? 's' : ''} ${iso === now ? 't' : ''}" ${off ? 'disabled' : ''} onclick="dpPick('${iso}')">${d}</button>`; }

async function sha256(str) {
  try {
    if (window.crypto && crypto.subtle) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) {}
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 'x' + (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
}

function resizeImage(file, max = 1280, q = 0.82) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      let w = img.width, h = img.height; const r = Math.min(1, max / Math.max(w, h));
      w = Math.round(w * r); h = Math.round(h * r);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('ย่อรูปไม่สำเร็จ')), 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('อ่านไฟล์รูปไม่ได้ (รองรับ JPG/PNG)')); };
    img.src = url;
  });
}
async function uploadImg(file) {

async function inlineImages(el) {
  const imgs = [...el.querySelectorAll('img')].filter(i => /^https?:/.test(i.src)), saved = []; let failed = 0;
  await Promise.all(imgs.map(async img => {
    try {
      const r = await fetch(img.src, { mode: 'cors' }); if (!r.ok) throw new Error('http');
      const b = await r.blob(), d = await new Promise((res, rej) => { const f = new FileReader(); f.onload = () => res(f.result); f.onerror = rej; f.readAsDataURL(b); });
      saved.push([img, img.src]); img.src = d;
    } catch (e) { failed++; }
  }));
  if (failed) toast('ใส่รูปภาพลง PDF ไม่ได้ ' + failed + ' รูป (เซิร์ฟเวอร์รูปไม่อนุญาต) ภาพเหล่านั้นอาจไม่ปรากฏใน PDF', 'warn');
  return () => saved.forEach(([i, s]) => { i.src = s; });
}

    await Promise.all([...el.querySelectorAll('img')].map(i => i.decode ? i.decode().catch(() => {}) : 0));
    const rect = el.getBoundingClientRect();

function cgEncAsk() {
  if (!isAdmin()) return;
  openModal('นำเข้า CG (ข้อมูลครบถ้วน)', `<p style="margin-top:0">ข้อมูล CG ${CG_ENC.n} คน จากไฟล์ CG.xlsx ถูกเข้ารหัสเก็บไว้ในไฟล์นี้ (เลขบัตรและเลขบัญชีจึงอ่านจากซอร์สโค้ดบน GitHub ไม่ได้) กรอกรหัสปลดล็อกเพื่อดูตัวอย่างก่อนนำเข้า</p>${field('รหัสปลดล็อก', '<input id="cgPass" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX" onkeydown="if(event.key===\'Enter\')cgEncOpen()">')}`,
    '<button class="btn btn-o" onclick="closeModal()">ยกเลิก</button><button class="btn" id="cgUnlock" onclick="cgEncOpen()">ปลดล็อก</button>');
  setTimeout(() => { const e = $('cgPass'); if (e) e.focus(); }, 50);
}
async function cgEncOpen() {
  const pw = val('cgPass').toUpperCase().replace(/[^A-Z0-9]/g, ''); if (!pw) return toast('กรุณากรอกรหัสปลดล็อก', 'err');
  const b = $('cgUnlock'); if (b) { b.disabled = true; b.textContent = 'กำลังตรวจสอบ...'; }
  let recs;
  try {
    const d = x => Uint8Array.from(atob(x), c => c.charCodeAt(0)), sub = crypto.subtle;
    const km = await sub.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await sub.deriveKey({ name: 'PBKDF2', salt: d(CG_ENC.salt), iterations: CG_ENC.iter, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    recs = JSON.parse(new TextDecoder().decode(await sub.decrypt({ name: 'AES-GCM', iv: d(CG_ENC.iv) }, key, d(CG_ENC.ct))));
  } catch (e) { if (b) { b.disabled = false; b.textContent = 'ปลดล็อก'; } return toast('รหัสปลดล็อกไม่ถูกต้อง (หรือเบราว์เซอร์ไม่รองรับการถอดรหัส)', 'err'); }
  cgPreview(recs);
}
function cgImportBtn() {
  return isAdmin() ? '<button class="btn btn-g" onclick="cgEncAsk()">⬆ นำเข้า CG ครบถ้วน (' + CG_ENC.n + ' คน)</button><button class="btn btn-o" onclick="$(\'cgFile\').click()">หรือเลือกไฟล์ Excel</button><input type="file" id="cgFile" accept=".xlsx,.xls" class="hide" onchange="cgFileChosen(this)">' : '';
}
function cgTable(items, eld) {
  if (!items.length) return '<div class="card empty">ยังไม่มีข้อมูล CG</div>';
  const priv = ME.role === 'viewer', mk = s => !s ? '-' : esc(priv ? maskId(s) : s);
  return `<div class="tw"><table><thead><tr><th class="n">ที่</th><th>CG</th><th class="n">จำนวน Pt ที่ดูแล</th><th>บ้านเลขที่</th><th>หมู่ที่</th><th>ตำบล</th><th>อำเภอ จังหวัด</th><th>เลขบัตรประชาชน</th><th>วันออกบัตร</th><th>วันหมดอายุ</th><th>เลขบัญชี ธกส</th><th>สาขา</th><th>ปีที่อบรม</th><th>สถานะ</th><th></th></tr></thead><tbody>${items.map((x, i) => `<tr><td class="n">${i + 1}</td><td><b>${esc(pName(x))}</b>${x.phone ? `<div class="mu sm">${esc(x.phone)}</div>` : ''}</td><td class="n">${eld.filter(e => e.cgId === x.id).length}</td><td>${esc(x.house || '-')}</td><td>${esc(x.moo || '-')}</td><td>${esc(x.tambon || '-')}</td><td>${esc(x.district || '-')}</td><td style="white-space:nowrap">${x.cid ? esc(priv ? maskId(x.cid) : cidFmt(x.cid)) : '-'}</td><td style="white-space:nowrap">${x.idIssue ? thDate(x.idIssue) : '-'}</td><td style="white-space:nowrap">${x.idLifetime ? 'ตลอดชีพ' : x.idExpire ? thDate(x.idExpire) : '-'}</td><td style="white-space:nowrap">${mk(x.bank)}</td><td>${esc(x.branch || '-')}</td><td>${esc(x.trainYear || '-')}</td><td>${isActive(x) ? '<span class="badge b-g1">ปฏิบัติงาน</span>' : '<span class="badge b-n">ไม่ได้ปฏิบัติงาน</span>'}</td><td class="n" style="white-space:nowrap">${canEdit() ? `<button class="btn btn-o btn-s" onclick="teamForm('cg','${x.id}')">แก้ไข</button> ` : ''}${isAdmin() ? `<button class="btn btn-d btn-s" onclick="teamDel('cgs','${x.id}')">ลบ</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`;
}
function cgForm(id) {

  openModal(id ? 'แก้ไข CG' : 'เพิ่ม CG', `${id ? `<div class="infobox" style="margin:0 0 12px">จำนวน Pt ที่ดูแล: <b>${n}</b> ราย (นับจากทะเบียนผู้สูงอายุอัตโนมัติ)</div>` : ''}
    <div class="grid g3">
      ${field('คำนำหน้า', `<select id="c_prefix">${opts(['นาย', 'นาง', 'นางสาว', 'น.ส.', ''].map(a => [a, a || '-']), x.prefix || '')}</select>`)}
      ${field('CG (ชื่อ-สกุล)', inp('c_name', x.name || ''), 'span2', true)}
      ${field('โทรศัพท์', inp('c_phone', x.phone || '', 'tel', 'inputmode="tel"'))}
      ${field('ปีที่อบรม (พ.ศ.)', inp('c_train', x.trainYear || '', 'text', 'inputmode="numeric" maxlength="4" placeholder="เช่น 2568"'))}

    </div>
    <div class="sec"><h4>ที่อยู่</h4><div class="grid g4">

    </div></div>
    <div class="sec"><h4>บัตรประจำตัวประชาชน</h4><div class="grid g4">
      ${field('เลขบัตรประชาชน (13 หลัก)', inp('c_cid', x.cid || '', 'text', 'inputmode="numeric" maxlength="17"'), 'span2')}

    <div class="mt2">${field('หมายเหตุ', inp('c_note', x.note || ''))}</div>`,
    `<button class="btn btn-o" onclick="closeModal()">ยกเลิก</button><button class="btn" onclick="cgSave('${id || ''}')">บันทึก</button>`, true);

async function cgSave(id) {
  const name = val('c_name'); if (!name) return toast('กรุณากรอกชื่อ-สกุล', 'err');
  const cid = val('c_cid').replace(/[\s-]/g, ''); if (cid && !/^\d{13}$/.test(cid)) return toast('เลขบัตรประชาชนต้องเป็นตัวเลข 13 หลัก', 'err');
  const life = $('c_life').checked, iss = val('c_iss'), exp = life ? '' : val('c_exp'), ty = val('c_train');
  if (iss && exp && exp < iss) return toast('วันหมดอายุบัตรต้องไม่ก่อนวันออกบัตร', 'err');
  if (ty && !/^\d{4}$/.test(ty)) return toast('ปีที่อบรมให้กรอกเป็น พ.ศ. 4 หลัก เช่น 2568', 'err');
  const data = { prefix: val('c_prefix'), name, phone: val('c_phone'), trainYear: ty, trained: !!ty, status: val('c_status'), house: val('c_house'), moo: val('c_moo'), tambon: val('c_tambon'), district: val('c_district'), cid, idIssue: iss, idExpire: exp, idLifetime: life, bank: val('c_bank'), branch: val('c_branch'), note: val('c_note') };

async function elderDel(id) {

  const n = list(S.visits).filter(v => v.elderId === id).length;
  if (!await ask(n ? `ผู้สูงอายุรายนี้มีบันทึกการเยี่ยม ${n} ครั้ง การลบจะทำให้ประวัติแสดงชื่อ "(ถูกลบ)" แนะนำให้เปลี่ยนสถานะเป็นย้ายออก/เสียชีวิตแทน ลบต่อหรือไม่?` : 'ลบผู้สูงอายุรายนี้ถาวร?', 'ลบ')) return;
  try { await dbDel('elders', id); closeModal(); toast('ลบแล้ว'); } catch (e) { toast('ลบไม่สำเร็จ: ' + e.message, 'err'); }
}

const SEED_CMS = [{"p":"นางสาว","n":"พรรณวดี คำผิว","full":"นางสาวพรรณวดี คำผิว"}];

/* ---------- นำเข้าข้อมูลผู้สูงอายุจากไฟล์ทะเบียน (ผู้สูงอายุ.xlsx) ---------- */
const seedKey = (f, l, h, m) => [f, l, h, m].map(x => String(x || '').replace(/\s+/g, '').trim()).join('|');
function seedPlan() {
  const have = new Set(list(S.elders).map(e => seedKey(e.fname, e.lname, e.house, e.moo)));
  const cgIdByName = {}; list(S.cgs).forEach(c => cgIdByName[cgKey(pName(c))] = c.id);
  const seen = new Set(), newCgs = SEED_CGS.filter(c => { const k = cgKey(c.full); if (cgIdByName[k] || seen.has(k)) return false; seen.add(k); return true; });
  const newElders = SEED_ELDERS.filter(e => !have.has(seedKey(e.f, e.l, e.h, e.m)));
  const cmIdByName = {}; list(S.cms).forEach(c => cmIdByName[cgKey(pName(c))] = c.id);
  const seenCm = new Set(), newCms = newElders.length ? SEED_CMS.filter(c => { const k = cgKey(c.full); if (cmIdByName[k] || seenCm.has(k)) return false; seenCm.add(k); return true; }) : [];
  return { newCgs, newCms, newElders, skipped: SEED_ELDERS.length - newElders.length, cgIdByName, cmIdByName };
}
function seedBuild(plan, keyGen, now, user) {
  const upd = {}, ids = { ...plan.cgIdByName }, cmIds = { ...plan.cmIdByName };
  plan.newCms.forEach(c => { const k = keyGen(); cmIds[cgKey(c.full)] = k; upd['cms/' + k] = { prefix: c.p, name: c.n, status: 'active', createdAt: now, createdBy: user, updatedAt: now }; });
  plan.newCgs.forEach(c => { const k = keyGen(); ids[cgKey(c.full)] = k; upd['cgs/' + k] = { prefix: c.p, name: c.n, status: 'active', createdAt: now, createdBy: user, updatedAt: now }; });
  plan.newElders.forEach(e => {
    const k = keyGen(), o = { prefix: e.p, fname: e.f, lname: e.l, house: e.h, moo: e.m, status: e.st, createdAt: now, createdBy: user, updatedAt: now };
    const cg = ids[cgKey(e.cg)]; if (cg) o.cgId = cg; const cm = e.cm && cmIds[cgKey(e.cm)]; if (cm) o.cmId = cm; if (e.n) o.note = e.n;
    upd['elders/' + k] = o;
  });
  return upd;
}
async function seedImport() {
  if (!isAdmin()) return;
  const p = seedPlan();
  if (!p.newElders.length) return toast('ผู้สูงอายุในไฟล์ทะเบียนมีอยู่ในระบบครบแล้ว (ข้าม ' + p.skipped + ' ราย)', 'warn');
  const msg = 'นำเข้าผู้สูงอายุใหม่ ' + p.newElders.length + ' ราย' + (p.newCgs.length ? ' และสร้าง CG ใหม่ ' + p.newCgs.length + ' คน' : '') + (p.newCms.length ? ' และ CM ใหม่ ' + p.newCms.length + ' คน' : '') + (p.skipped ? ' (ข้ามรายที่มีอยู่แล้ว ' + p.skipped + ' ราย)' : '') + ' ?';
  if (!await ask(msg, 'นำเข้า', false)) return;
  try {
    await db.ref().update(clean(seedBuild(p, () => db.ref().push().key, Date.now(), ME.username)));
    toast('นำเข้าข้อมูลเรียบร้อย ' + p.newElders.length + ' ราย');
  } catch (e) { toast('นำเข้าไม่สำเร็จ: ' + e.message, 'err'); }
}


/* ---------- นำเข้า CM จากไฟล์ทะเบียน: สร้าง CM และผูกกับผู้สูงอายุที่มีอยู่แล้ว ---------- */
function cmSeedPlan() {
  const cmByKey = {}; list(S.cms).forEach(c => { const k = cgKey(pName(c)); if (!cmByKey[k]) cmByKey[k] = c.id; });
  const newCms = SEED_CMS.filter(c => !cmByKey[cgKey(c.full)]);
  const byElder = {}; list(S.elders).forEach(e => byElder[seedKey(e.fname, e.lname, e.house, e.moo)] = e);
  const links = []; let already = 0, missing = 0, changed = 0;
  SEED_ELDERS.forEach(s => {
    const e = byElder[seedKey(s.f, s.l, s.h, s.m)]; if (!e) { missing++; return; }
    const id = cmByKey[cgKey(s.cm)]; if (id && e.cmId === id) { already++; return; }
    if (e.cmId) changed++; links.push({ elderId: e.id, cm: s.cm });
  });
  return { newCms, links, already, missing, changed, cmByKey };
}
function cmSeedBuild(plan, keyGen, now, user) {
  const upd = {}, ids = { ...plan.cmByKey };
  plan.newCms.forEach(c => { const k = keyGen(); ids[cgKey(c.full)] = k; upd['cms/' + k] = { prefix: c.p, name: c.n, status: 'active', createdAt: now, createdBy: user, updatedAt: now }; });
  plan.links.forEach(l => { const id = ids[cgKey(l.cm)]; if (id) { upd['elders/' + l.elderId + '/cmId'] = id; upd['elders/' + l.elderId + '/updatedAt'] = now; upd['elders/' + l.elderId + '/updatedBy'] = user; } });
  return upd;
}
function cmImportBtn() { return isAdmin() ? '<button class="btn btn-o" onclick="cmSeedImport()">⬆ นำเข้า CM จากไฟล์ทะเบียน</button>' : ''; }
async function cmSeedImport() {
  if (!isAdmin()) return; const p = cmSeedPlan();
  if (!p.newCms.length && !p.links.length) return toast('CM และการผูกกับผู้สูงอายุครบถ้วนแล้ว' + (p.missing ? ' (ยังไม่มีในระบบ ' + p.missing + ' ราย — ให้นำเข้าผู้สูงอายุก่อน)' : ''), 'warn');
  const msg = (p.newCms.length ? 'สร้าง CM ใหม่ ' + p.newCms.length + ' คน (' + p.newCms.map(c => c.full).join(', ') + ') และ' : '') + 'กำหนด CM ให้ผู้สูงอายุ ' + p.links.length + ' ราย' + (p.changed ? ' (เปลี่ยนจาก CM เดิม ' + p.changed + ' ราย)' : '') + (p.already ? ' · ผูกไว้แล้ว ' + p.already + ' ราย' : '') + (p.missing ? ' · ยังไม่มีในระบบ ' + p.missing + ' ราย (ข้าม)' : '') + ' ?';

/* =====================================================================
   หน้าสาธารณะ (ดูอย่างเดียว) — แสดงเฉพาะสถิติภาพรวมที่ไม่ระบุตัวบุคคล
   ผู้เยี่ยมชมอ่านเฉพาะ node "publicSummary" ไม่ได้เปิดข้อมูลผู้สูงอายุ/CG/CM รายบุคคลในหน้านี้
   ===================================================================== */
let PUB = null, pubLast = '', pubTimer = null;
function buildPublicSummary() {
  const fy = curFY(), [f0, f1] = fyRange(fy), t = today(), ym = t.slice(0, 7), D = derived(), elders = list(S.elders).filter(isActive), mv = monthVisits(D, ym);
  const dc = { 0: 0, 1: 0, 2: 0, 3: 0, 4: 0 }; elders.forEach(e => dc[depNo(e)]++);
  const vFY = D.vs.filter(v => v.date >= f0 && v.date <= f1), vM = D.vs.filter(v => v.date.startsWith(ym));
  const monthly = FY_ORDER.map(mi => { const y = mi >= 9 ? fy - 1 : fy, key = y + '-' + String(mi + 1).padStart(2, '0'); return { key, label: MONTHS_S[mi], n: vFY.filter(v => v.date.startsWith(key)).length }; });
  const groups = [1, 2, 3, 4].map(g => { const es = elders.filter(e => depNo(e) === g), q = DEP[g].q, tgt = es.length * q, done = es.reduce((a, e) => a + Math.min(mv[e.id] || 0, q), 0), met = es.filter(e => (mv[e.id] || 0) >= q).length; return { g, n: es.length, q, tgt, done, met, pct: tgt ? Math.round(done * 100 / tgt) : 0 }; });
  const careTally = []; vFY.forEach(v => (v.care || []).forEach(c => careTally.push(c)));
  return { asOf: t, fy, ym, total: elders.length, dc, visitsMonth: vM.length, visitsFY: vFY.length, eldersVisitedFY: new Set(vFY.map(v => v.elderId)).size, cmN: list(S.cms).filter(isActive).length, cgN: list(S.cgs).filter(isActive).length, monthly, groups,
    byMoo: tally(vFY, v => S.elders[v.elderId] && S.elders[v.elderId].moo, m => 'หมู่ ' + m, 20), care: tally(careTally, x => x, null, 11) };
}
function schedulePublic() {
  if (!ME || ME.role === 'viewer' || !PUB || PUB.enabled !== true) return;
  clearTimeout(pubTimer); pubTimer = setTimeout(() => publishPublic(false), 2500);
}
async function publishPublic(force) {
  if (!db || !ME) return;
  try { const d = clean(buildPublicSummary()), str = JSON.stringify(d); if (!force && str === pubLast) return; pubLast = str; await db.ref('publicSummary').update({ enabled: true, updatedAt: Date.now(), data: d }); }
  catch (e) { pubLast = ''; if (force) toast('อัปเดตข้อมูลหน้าสาธารณะไม่สำเร็จ: ' + e.message, 'err'); }
}
const pubLink = () => location.href.split(/[?#]/)[0] + '?public=1';
function pubCard() {

  const upTxt = up ? thDate(new Date(up - up.getTimezoneOffset() * 60000).toISOString().slice(0, 10)) + ' ' + up.toTimeString().slice(0, 5) + ' น.' : '-';
  return `<div class="card" style="margin-bottom:14px"><div class="row sp"><h3 style="margin:0">🌐 หน้าสาธารณะ (ดูอย่างเดียว) ${on ? '<span class="badge b-g1">เปิดอยู่</span>' : '<span class="badge b-n">ปิดอยู่</span>'}</h3>
    <button class="btn ${on ? 'btn-d' : ''}" onclick="pubToggle()">${on ? 'ปิดหน้าสาธารณะ' : 'เปิดหน้าสาธารณะ'}</button></div>
    <p class="mu sm" style="margin:8px 0 10px">บุคคลภายนอกที่มีลิงก์เข้าดูได้โดยไม่ต้องเข้าสู่ระบบ เห็นเฉพาะสถิติภาพรวม (จำนวนผู้สูงอายุแต่ละกลุ่ม การเยี่ยม กราฟ) ไม่มีชื่อ ที่อยู่ หรือข้อมูลรายบุคคล และแก้ไขหรือกดดูรายละเอียดไม่ได้</p>

      ${kpi('ผู้ดูแล (CG)', d.cgN + ' คน', d.cgN ? 'เฉลี่ย ' + (d.total / d.cgN).toFixed(1) + ' ราย/คน' : '', '#7a5aa6', '🤝')}

  const us = list(S.users).sort((a, b) => cmp(a.username, b.username));
  return pubCard() + `<div class="row sp" style="margin-bottom:12px"><div class="mu sm">ผู้ดูแลระบบ = ทุกอย่าง · เจ้าหน้าที่ / CG = บันทึกและแก้ไข (ลบไม่ได้) · ผู้ดูข้อมูล = ดูอย่างเดียว</div><div class="row"><button class="btn btn-o" onclick="cgUsersPreview()">👥 สร้างผู้ใช้ CG ทั้งหมด</button><button class="btn" onclick="userForm()">＋ เพิ่มผู้ใช้</button></div></div>
    <div class="tw"><table><thead><tr><th>ชื่อผู้ใช้</th><th>ชื่อ-สกุล</th><th>สิทธิ์</th><th>สถานะ</th><th></th></tr></thead><tbody>${us.map(u => `<tr><td><b>${esc(u.username)}</b>${u.id === ME.id ? ' <span class="badge b-p">คุณ</span>' : ''}</td><td>${esc(u.name || '')}</td><td>${ROLES[u.role] || u.role}${u.cgId && S.cgs[u.cgId] ? `<div class="mu sm">CG: ${esc(nmCg(u.cgId))}</div>` : ''}</td><td>${u.active === false ? '<span class="badge b-n">ปิดใช้งาน</span>' : '<span class="badge b-g1">ใช้งาน</span>'}</td><td class="n" style="white-space:nowrap"><button class="btn btn-o btn-s" onclick="userForm('${u.id}')">แก้ไข</button>${u.id !== ME.id ? ` <button class="btn btn-d btn-s" onclick="userDel('${u.id}')">ลบ</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`;
}
function userForm(id) {
  const u = id ? S.users[id] : {};
  openModal(id ? 'แก้ไขผู้ใช้' : 'เพิ่มผู้ใช้', `<div class="grid g2">
    ${field('ชื่อผู้ใช้ (ภาษาอังกฤษ/ตัวเลข)', inp('u_user', u.username || '', 'text', 'autocapitalize="none" ' + (id ? '' : '')), '', true)}${field('ชื่อ-สกุล', inp('u_name', u.name || ''), '', true)}
    ${field('สิทธิ์', `<select id="u_role">${opts(Object.entries(ROLES), u.role || 'staff')}</select>`)}${field('สถานะ', `<select id="u_active">${opts([['1', 'ใช้งาน'], ['0', 'ปิดใช้งาน']], u.active === false ? '0' : '1')}</select>`)}
    ${field('เชื่อมกับ CG (ใช้กับสิทธิ์ CG)', `<select id="u_cg">${cgOpts(u.cgId, '- ไม่เชื่อม -')}</select>`, 'spanall')}
    ${field(id ? 'รหัสผ่านใหม่ (เว้นว่าง = ไม่เปลี่ยน)' : 'รหัสผ่าน (อย่างน้อย 6 ตัว)', '<input id="u_pw" type="password" autocomplete="new-password">', 'spanall', !id)}</div>`,
    `<button class="btn btn-o" onclick="closeModal()">ยกเลิก</button><button class="btn" onclick="userSave('${id || ''}')">บันทึก</button>`);
}
const adminCount = ex => list(S.users).filter(u => u.role === 'admin' && u.active !== false && u.id !== ex).length;
async function userSave(id) {
  const username = normU(val('u_user')), name = val('u_name'), pw = $('u_pw').value, role = val('u_role'), active = val('u_active') === '1';
  if (!/^[a-z0-9._\-\u0E00-\u0E7F]{3,}$/.test(username)) return toast('ชื่อผู้ใช้ใช้ได้เฉพาะตัวอักษรไทย a-z 0-9 . _ - อย่างน้อย 3 ตัว', 'err');
  if (!name) return toast('กรุณากรอกชื่อ-สกุล', 'err');
  if (list(S.users).some(u => normU(u.username) === username && u.id !== id)) return toast('ชื่อผู้ใช้นี้ถูกใช้แล้ว', 'err');
  if (!id && pw.length < 6) return toast('รหัสผ่านต้องยาวอย่างน้อย 6 ตัว', 'err');
  if (id && pw && pw.length < 6) return toast('รหัสผ่านต้องยาวอย่างน้อย 6 ตัว', 'err');
  if (id && (role !== 'admin' || !active) && adminCount(id) === 0) return toast('ต้องมีผู้ดูแลระบบที่ใช้งานอยู่อย่างน้อย 1 คน', 'err');
  try { const d = { username, name, role, active, cgId: role === 'cg' ? val('u_cg') : '' }; if (pw) d.pass = await hashPw(pw); await dbSave('users', id || null, d); closeModal(); toast('บันทึกผู้ใช้แล้ว'); } catch (e) { toast('บันทึกไม่สำเร็จ: ' + e.message, 'err'); }
}

/* ---------- สร้างผู้ใช้ CG ทั้งหมดจากรายชื่อ CG ในระบบ ---------- */
const CG_DEFAULT_PW = '123456';
const normU = s => String(s || '').normalize('NFC').trim().toLowerCase();
const cgFirstName = c => (splitPrefix(((c.prefix || '') + (c.name || '')).trim())[1] || '').split(/\s+/)[0] || '';
function cgUsersPlan() {
  const have = new Set(list(S.users).map(u => normU(u.username))), linked = new Set(list(S.users).map(u => u.cgId).filter(Boolean)), seen = new Set(), add = [], skip = [];
  list(S.cgs).filter(isActive).sort((a, b) => cmp(a.name, b.name)).forEach(c => {
    const un = normU(cgFirstName(c)), full = pName(c);
    if (!un) return skip.push([full, 'ไม่มีชื่อ']);
    if (linked.has(c.id)) return skip.push([full, 'มีผู้ใช้เชื่อมกับ CG คนนี้แล้ว']);
    if (have.has(un) || seen.has(un)) return skip.push([full, 'ชื่อผู้ใช้ "' + un + '" ซ้ำ']);
    seen.add(un); add.push({ c, un, full });
  });
  return { add, skip };
}
function cgUsersPreview() {
  if (!isAdmin()) return; const p = cgUsersPlan();
  if (!p.add.length && !p.skip.length) return toast('ยังไม่มีข้อมูล CG ในระบบ — นำเข้า CG ที่หน้า จัดการ CM และ CG ก่อน', 'warn');
  openModal('สร้างผู้ใช้ CG ทั้งหมด', `<p style="margin-top:0">จะสร้างผู้ใช้ <b>${p.add.length}</b> คน · ชื่อผู้ใช้ = ชื่อต้น (ไม่รวมคำนำหน้าและนามสกุล) · รหัสผ่านเริ่มต้น <b>${CG_DEFAULT_PW}</b> · สิทธิ์ ผู้ดูแล CG (บันทึก/แก้ไข ลบไม่ได้)</p>
    ${p.add.length ? `<div class="tw"><table><thead><tr><th>ชื่อผู้ใช้</th><th>ชื่อ-สกุล</th></tr></thead><tbody>${p.add.map(a => `<tr><td><b>${esc(a.un)}</b></td><td>${esc(a.full)}</td></tr>`).join('')}</tbody></table></div>` : ''}
    ${p.skip.length ? `<div class="infobox">ข้าม ${p.skip.length} รายการ: ${esc(p.skip.map(x => x[0] + ' (' + x[1] + ')').join(', '))}</div>` : ''}
    <div class="mu sm mt2">แนะนำให้ CG แต่ละคนเปลี่ยนรหัสผ่านหลังเข้าสู่ระบบครั้งแรก</div>`,
    `<button class="btn btn-o" onclick="closeModal()">ยกเลิก</button>${p.add.length ? `<button class="btn" id="cgUGo" onclick="cgUsersCreate()">สร้าง ${p.add.length} ผู้ใช้</button>` : ''}`);
}
async function cgUsersCreate() {
  if (!isAdmin()) return; const p = cgUsersPlan(); if (!p.add.length) return closeModal();
  const b = $('cgUGo'); if (b) { b.disabled = true; b.textContent = 'กำลังสร้าง...'; }
  try {
    const pass = await hashPw(CG_DEFAULT_PW), now = Date.now(), upd = {};
    p.add.forEach(a => { upd['users/' + db.ref('users').push().key] = { username: a.un, name: a.full, role: 'cg', active: true, cgId: a.c.id, pass, createdAt: now, createdBy: ME.username, updatedAt: now }; });
    await db.ref().update(clean(upd)); closeModal(); toast('สร้างผู้ใช้ CG แล้ว ' + p.add.length + ' คน');
  } catch (e) { toast('สร้างไม่สำเร็จ: ' + e.message, 'err'); if (b) { b.disabled = false; b.textContent = 'ลองอีกครั้ง'; } }
}
async function userDel(id) {
  if (S.users[id].role === 'admin' && adminCount(id) === 0) return toast('ต้องมีผู้ดูแลระบบอย่างน้อย 1 คน', 'err');
  if (!await ask('ลบผู้ใช้ "' + S.users[id].username + '"?', 'ลบ')) return; try { await dbDel('users', id); toast('ลบแล้ว'); } catch (e) { toast('ลบไม่สำเร็จ: ' + e.message, 'err'); }
}
function pwModal() {
  openModal('เปลี่ยนรหัสผ่าน', `<div class="grid">${field('รหัสผ่านเดิม', '<input id="pw0" type="password" autocomplete="current-password">')}${field('รหัสผ่านใหม่ (อย่างน้อย 6 ตัว)', '<input id="pw1" type="password" autocomplete="new-password">')}${field('ยืนยันรหัสผ่านใหม่', '<input id="pw2" type="password" autocomplete="new-password">')}</div>`,
    '<button class="btn btn-o" onclick="closeModal()">ยกเลิก</button><button class="btn" onclick="pwSave()">เปลี่ยนรหัสผ่าน</button>');
}
async function pwSave() {
  const a = $('pw0').value, b = $('pw1').value, c = $('pw2').value;
  if (await hashPw(a) !== ME.pass) return toast('รหัสผ่านเดิมไม่ถูกต้อง', 'err');
  if (b.length < 6) return toast('รหัสผ่านใหม่ต้องยาวอย่างน้อย 6 ตัว', 'err'); if (b !== c) return toast('ยืนยันรหัสผ่านไม่ตรงกัน', 'err');
  try { const h = await hashPw(b); await db.ref('users/' + ME.id).update({ pass: h, updatedAt: Date.now() }); ME.pass = h; closeModal(); toast('เปลี่ยนรหัสผ่านแล้ว'); } catch (e) { toast('ไม่สำเร็จ: ' + e.message, 'err'); }
}
</script>
</body>
</html>
